<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Music Widget</title>
        <link href="css/style.css" rel="stylesheet">
    </head>
    <body>
        <div id="music">
            <div class="featured">
                <img 
                    class="featured-album"
                    src="images/album-0.jpg"
                    alt="album cover"
                    width="50"
                >
                <div class="details">
                    <h3>All I Really Want</h3>
                    <p>Alanis Morisette</p>
                </div>
                <div class="albums">
                    <img
                        src="images/album-1.jpg"
                        alt="album cover"
                        width="150"
                    >
                    <img
                        src="images/album-2.jpg"
                        alt="album cover"
                        width="150"
                    >
                    <img
                        src="images/album-3.jpg"
                        alt="album cover"
                        width="150"
                    >
                    <img
                        src="images/album-4.jpg"
                        alt="album cover"
                        width="150"
                    >
                </div>
            </div>
    </body>
</html>
