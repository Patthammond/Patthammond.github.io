<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Floating Color Palettes</title>
        <link href="css/style.css" rel="stylesheet">
    </head>
    <body>
        <div class="color-palette" id="meadow">
            <h2>Meadow</h2>
            <h4 class="color" id="grape">Vintage Grape #694873</h4>
            <h4 class="color" id="mauve">Dust Mauve #8B728E</h4>
            <h4 class="color" id="teal">Muted Teal #85B79D</h4>
        </div>
        <div class="color-palette" id="bubble-pop">
            <h2>Bubble Pop</h2>
            <h4 class="color" id="pink">Bubble Gum Pink #EF476F</h4>
            <h4 class="color" id="pollen">Golden Pollen #FFD166</h4>
            <h4 class="color" id="emerald">Emerald #06D6A0</h4>
        </div>
        <div class="color-palette" id="stone-ocean">
            <h2>Stone Ocean</h2>
            <h4 class="color" id="blue">Steel Blue #7C99B4</h4>
            <h4 class="color" id="grey">Slate Grey #6B7F82</h4>
            <h4 class="color" id="brown">Stone Brown #5B5750</h4>
        </div>
    </body>
</html>
