<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Floating Color Palettes</title>
        <link href="css/style.css" rel="stylesheet">
    </head>
    <body>
        <div class="color-palette">
            <h2>Meadow</h2>
            <h4 class="color-1">Vintage Grape #694873</h4>
            <h4 class="color-2">Dust Mauve #8B728E</h4>
            <h4 class="color-3">Muted Teal #85B79D</h4>
        </div>
        <div class="color-palette-2">
            <h2>Bubble Pop</h2>
            <h4 class="color-4">Bubble Gum Pink #EF476F</h4>
            <h4 class="color-5">Golden Pollen #FFD166</h4>
            <h4 class="color-6">Emerald #06D6A0</h4>
        </div>
        <div class="color-palette-3">
            <h2>Stone Ocean</h2>
            <h4 class="color-7">Steel Blue #7C99B4</h4>
            <h4 class="color-8">Slate Grey #6B7F82</h4>
            <h4 class="color-9">Stone Brown #5B5750</h4>
        </div>
    </body>
</html>
